<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="back2" x1="0" y1="0" x2="1280" y2="800"><stop stop-color="#0C0B10"/><stop offset="1" stop-color="#1C1031"/></linearGradient>
    <linearGradient id="purple2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <filter id="shadow2"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1280" height="800" fill="url(#back2)"/>
  <circle cx="1050" cy="80" r="300" fill="#7C3AED" opacity=".08"/>

  <g transform="translate(85 116)">
    <text x="0" y="0" fill="#A78BFA" font-family="Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="2.5">YOUR TIME. YOUR FORMAT.</text>
    <text x="0" y="62" fill="#FAF7FF" font-family="Arial, sans-serif" font-weight="750" font-size="51">Quiet by default.</text>
    <text x="0" y="119" fill="#FAF7FF" font-family="Arial, sans-serif" font-weight="750" font-size="51">Precise when needed.</text>
    <text x="0" y="170" fill="#AFA5BA" font-family="Arial, sans-serif" font-size="19">Every useful setting. None of the bloat.</text>

    <g transform="translate(0 225)" font-family="Arial, sans-serif">
      <circle cx="9" cy="8" r="8" fill="#7C3AED"/><path d="m5 8 3 3 6-7" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="30" y="14" fill="#DED7E6" font-size="16">12-hour or 24-hour clocks</text>
      <circle cx="9" cy="50" r="8" fill="#7C3AED"/><path d="m5 50 3 3 6-7" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="30" y="56" fill="#DED7E6" font-size="16">Local time or UTC</text>
      <circle cx="9" cy="92" r="8" fill="#7C3AED"/><path d="m5 92 3 3 6-7" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="30" y="98" fill="#DED7E6" font-size="16">Date, seconds, role and position controls</text>
      <circle cx="9" cy="134" r="8" fill="#7C3AED"/><path d="m5 134 3 3 6-7" stroke="#fff" stroke-width="2" fill="none"/>
      <text x="30" y="140" fill="#DED7E6" font-size="16">Preferences saved by your browser</text>
    </g>
  </g>

  <g transform="translate(768 68)" filter="url(#shadow2)">
    <rect width="405" height="664" rx="28" fill="#121017" stroke="#3B304A"/>
    <circle cx="50" cy="53" r="23" fill="url(#purple2)"/>
    <circle cx="50" cy="53" r="12" fill="#171020" stroke="#fff" stroke-width="3"/><path d="M50 45v9l7 4" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="86" y="43" fill="#A992ED" font-family="Arial, sans-serif" font-weight="800" font-size="10" letter-spacing="1.5">CHATGPT MESSAGE TIME</text>
    <text x="86" y="66" fill="#F7F4FF" font-family="Arial, sans-serif" font-weight="750" font-size="23">ChatTime</text>
    <rect x="333" y="42" width="45" height="25" rx="12.5" fill="#6D3EE7"/>
    <circle cx="365" cy="54.5" r="9" fill="#fff"/>

    <rect x="25" y="99" width="355" height="55" rx="13" fill="#21182E" stroke="#4B3769"/>
    <text x="41" y="122" fill="#93899E" font-family="Arial, sans-serif" font-size="11">Preview</text>
    <text x="363" y="133" fill="#E6DCFF" font-family="monospace" text-anchor="end" font-size="12">9 Aug 2026, 22:14</text>

    <g transform="translate(25 176)" font-family="Arial, sans-serif">
      <rect width="355" height="354" rx="14" fill="#17141C" stroke="#302837"/>
      <g fill="#E7E1EC" font-size="13">
        <text x="17" y="37">Clock</text><text x="327" y="37" text-anchor="end" fill="#CBBFDD">24-hour⌄</text>
        <text x="17" y="95">Time zone</text><text x="327" y="95" text-anchor="end" fill="#CBBFDD">Local time⌄</text>
        <text x="17" y="153">Show on</text><text x="327" y="153" text-anchor="end" fill="#CBBFDD">Every message⌄</text>
        <text x="17" y="211">Position</text><text x="327" y="211" text-anchor="end" fill="#CBBFDD">Above message⌄</text>
        <text x="17" y="269">Appearance</text><text x="327" y="269" text-anchor="end" fill="#CBBFDD">Quiet text⌄</text>
      </g>
      <g stroke="#2C2532"><path d="M0 58h355M0 116h355M0 174h355M0 232h355M0 290h355"/></g>
      <rect x="17" y="316" width="14" height="14" rx="3" fill="#7C3AED"/><path d="m20 323 3 3 5-7" stroke="#fff" stroke-width="1.6" fill="none"/>
      <text x="39" y="328" fill="#CFC7D8" font-size="11">Show date</text>
      <rect x="183" y="316" width="14" height="14" rx="3" fill="#24202A" stroke="#4B4353"/>
      <text x="205" y="328" fill="#CFC7D8" font-size="11">Show seconds</text>
    </g>

    <text x="42" y="564" fill="#AA9DB7" font-family="Arial, sans-serif" font-size="11" font-weight="700">Reset defaults</text>
    <text x="361" y="564" fill="#82798C" text-anchor="end" font-family="Arial, sans-serif" font-size="10">Saved in browser</text>

    <rect x="25" y="595" width="355" height="43" rx="12" fill="#15121A" stroke="#29232F"/>
    <path d="M45 615h10v8H45zM47 615v-3a3 3 0 0 1 6 0v3" stroke="#9C8EAB" stroke-width="1.6" fill="none"/>
    <text x="66" y="621" fill="#A99FAF" font-family="Arial, sans-serif" font-size="11">No tracking. No conversation collection.</text>
  </g>
</svg>
